baseURL = "https://7xrzan.github.io/"
title = "Kernelized"
languageCode = "es-mx"
defaultContentLanguage = "es"

theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[pagination]
pagerSize = 10

# ----------------------------
# PAPER MOD CONFIG
# ----------------------------

[params]
homeInfoParams = true

defaultTheme = "dark"
disableThemeToggle = true

ShowCodeCopyButtons = true
ShowReadingTime = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowToc = true
env = "production"
disableSpecial1stPost = true
displayFullContent = false
hideAllPosts = true

# ----------------------------
# SEARCH
# ----------------------------

[outputs]
home = ["HTML","RSS","JSON"]

# ----------------------------
# MENU
# ----------------------------

[[menu.main]]
identifier = "home"
name = "home"
url = "/"
weight = 1

[[menu.main]]
identifier = "posts"
name = "posts"
url = "/posts/"
weight = 2

[[menu.main]]
identifier = "about"
name = "about"
url = "/about/"
weight = 3

# ----------------------------
# SYNTAX HIGHLIGHT
# ----------------------------

[markup]

[markup.highlight]
style = "nord"
lineNos = true
lineNumbersInTable = false
tabWidth = 4
noClasses = true
guessSyntax = true

[markup.tableOfContents]
startLevel = 1
endLevel = 4
